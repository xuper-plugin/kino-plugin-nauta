<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F3B8C"/>
      <stop offset="100%" stop-color="#1A6FD4"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="128" height="128" rx="22" ry="22" fill="url(#bg)"/>

  <!-- TV screen body -->
  <rect x="16" y="36" width="96" height="62" rx="8" ry="8" fill="none"
        stroke="white" stroke-width="4.5" stroke-opacity="0.95"/>

  <!-- Screen inner fill -->
  <rect x="22" y="42" width="84" height="50" rx="4" ry="4" fill="white" fill-opacity="0.08"/>

  <!-- Live dot + text -->
  <circle cx="44" cy="67" r="6" fill="#FF3B30"/>
  <rect x="55" y="62" width="20" height="4" rx="2" fill="white" fill-opacity="0.9"/>
  <rect x="55" y="70" width="14" height="4" rx="2" fill="white" fill-opacity="0.55"/>

  <!-- TV legs -->
  <line x1="48" y1="98" x2="40" y2="112" stroke="white" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="80" y1="98" x2="88" y2="112" stroke="white" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="36" y1="112" x2="92" y2="112" stroke="white" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Antenna left -->
  <line x1="52" y1="36" x2="36" y2="16" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Antenna right -->
  <line x1="76" y1="36" x2="92" y2="16" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Signal arc 1 (small) -->
  <path d="M 96 60 A 9 9 0 0 1 96 74" fill="none" stroke="white" stroke-width="3"
        stroke-linecap="round" stroke-opacity="0.9"/>
  <!-- Signal arc 2 (medium) -->
  <path d="M 102 54 A 15 15 0 0 1 102 80" fill="none" stroke="white" stroke-width="2.5"
        stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Signal arc 3 (large) -->
  <path d="M 108 48 A 21 21 0 0 1 108 86" fill="none" stroke="white" stroke-width="2"
        stroke-linecap="round" stroke-opacity="0.35"/>
</svg>
